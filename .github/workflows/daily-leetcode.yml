name: daily-leetcode

# Targets 3:00 PM Pacific year-round.
# GitHub cron is UTC only AND scheduled runs are routinely delayed 30-60+
# minutes, so we fire several times each afternoon and let the guard decide:
# proceed when it is 15:00-20:59 in America/Los_Angeles AND today's issue
# does not exist yet. First attempt that lands wins; the rest self-skip.
# This makes every later cron an automatic retry for a delayed/missed run.
on:
  schedule:
    - cron: "0 22 * * *" # 15:00 PDT / 14:00 PST
    - cron: "0 23 * * *" # 16:00 PDT / 15:00 PST
    - cron: "0 0 * * *" #  17:00 PDT / 16:00 PST
    - cron: "0 2 * * *" #  19:00 PDT / 18:00 PST
  workflow_dispatch: # manual "Run workflow" button, always proceeds

permissions:
  contents: write # commit state.json back
  issues: write # comment the daily plan

concurrency:
  group: daily-leetcode
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard - once per Pacific day, from 3 PM PT onward
        id: guard
        run: |
          hour=$(TZ=America/Los_Angeles date +%H)
          PT_DATE=$(TZ=America/Los_Angeles date +%F)
          TITLE="Daily LeetCode $PT_DATE"
          echo "pt_date=$PT_DATE" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - proceeding."
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Too early in the PT day (a cron twin that lands before 3 PM PT).
          if [ "$((10#$hour))" -lt 15 ] || [ "$((10#$hour))" -gt 20 ]; then
            echo "Skipping: ${hour}:00 PT is outside the 15:00-20:59 window."
            echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Already posted today? Then this cron is a redundant retry.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                     --search "\"$TITLE\" in:title" --state all \
                     --json title --jq "[.[] | select(.title == \"$TITLE\")] | length")
          if [ "${existing:-0}" -gt 0 ]; then
            echo "Skipping: '$TITLE' already exists."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "Proceeding at ${hour}:00 PT."
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'yes'
        uses: actions/checkout@v4

      - name: Generate today's plan (Pacific date)
        if: steps.guard.outputs.run == 'yes'
        run: |
          PT_DATE=$(TZ=America/Los_Angeles date +%F)
          python3 spaced_repetition/sr.py today --md --date "$PT_DATE" | tee plan.md
          printf '\ncc @%s\n' "${{ github.repository_owner }}" >> plan.md

      - name: Commit updated state.json
        if: steps.guard.outputs.run == 'yes'
        run: |
          if ! git diff --quiet spaced_repetition/state.json 2>/dev/null; then
            git config user.name "LambdaNotFound"
            git config user.email "yiqyudev@gmail.com"
            git add spaced_repetition/state.json
            git commit -m "sr: record daily plan"
            git pull --rebase origin main
            git push
          else
            echo "state.json unchanged (idempotent rerun) - nothing to commit."
          fi

      - name: Create today's issue (idempotent - edits body on rerun)
        if: steps.guard.outputs.run == 'yes'
        run: |
          PT_DATE=$(TZ=America/Los_Angeles date +%F)
          TITLE="Daily LeetCode $PT_DATE"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                     --search "\"$TITLE\" in:title" --state all \
                     --json number,title --jq '.[] | "\(.number)\t\(.title)"' \
                     | awk -F'\t' -v t="$TITLE" '$2==t{print $1; exit}')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file plan.md
            echo "Updated existing issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body-file plan.md
          fi

      - name: Close earlier daily issues
        if: steps.guard.outputs.run == 'yes'
        run: |
          PT_DATE=$(TZ=America/Los_Angeles date +%F)
          TITLE="Daily LeetCode $PT_DATE"
          gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "Daily LeetCode in:title" --state open \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' \
            | awk -F'\t' -v t="$TITLE" 'index($2,"Daily LeetCode")==1 && $2!=t {print $1}' \
            | while read -r n; do
                gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                  --comment "Superseded by today's plan. (You can still log solves by commenting here - closed issues work too.)"
              done
