name: daily-leetcode

# Targets 3:00 PM Pacific year-round.
# GitHub cron is UTC only AND scheduled runs are routinely delayed (2-4 hours
# in November 2026), so we fire hourly from before 3 PM until late evening and
# let the guard decide: proceed when it is 15:00 or later in
# America/Los_Angeles AND today's issue does not exist yet. First attempt that
# lands wins; the rest self-skip. This makes every later cron an automatic
# retry for a delayed/missed run. Minute 30 avoids the top of the hour, when
# GitHub's scheduler is busiest.
on:
  schedule:
    - cron: "30 19-23 * * *" # 12:30-16:30 PDT / 11:30-15:30 PST
    - cron: "30 0-6 * * *" #   17:30-23:30 PDT / 16:30-22:30 PST
  workflow_dispatch: # manual "Run workflow" button, always proceeds

permissions:
  contents: write # commit state.json back
  issues: write # comment the daily plan

# Daily runs wait for each other, so two of them can't both open the day's
# issue. log-solve.yml stays out of this queue: a waiting log run used to be
# cancelled by the next arrival. Both write state.json safely anyway, since
# each retries its push on top of whatever landed first.
concurrency:
  group: daily-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard - once per Pacific day, from 3 PM PT onward
        id: guard
        run: |
          # Read both from one clock call, so midnight can't fall between them.
          read -r PT_DATE hour <<< "$(TZ=America/Los_Angeles date '+%F %H')"
          TITLE="Daily Practice $PT_DATE"
          echo "pt_date=$PT_DATE" >> "$GITHUB_OUTPUT"

          # Number of the issue titled $1, or titled the way issues were
          # before 11-25-2026 ("Daily LeetCode ..."), if there is one.
          find_issue() {
            local t n
            for t in "$1" "Daily LeetCode${1#Daily Practice}"; do
              n=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                  --search "\"$t\" in:title" --state all \
                  --json number,title --jq '.[] | "\(.number)\t\(.title)"' \
                  | awk -F'\t' -v t="$t" '$2==t{print $1; exit}')
              if [ -n "$n" ]; then echo "$n"; return; fi
            done
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - proceeding."
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Too early in the PT day (a cron twin that lands before 3 PM PT).
          if [ "$((10#$hour))" -lt 15 ]; then
            echo "Skipping: ${hour}:00 PT is before 15:00."
            echo "run=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Already posted today? Then this cron is a redundant retry.
          if [ -n "$(find_issue "$TITLE")" ]; then
            echo "Skipping: '$TITLE' already exists."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "Proceeding at ${hour}:00 PT."
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'yes'
        uses: actions/checkout@v4

      # Raw material for the missed-log check below. The check is extra, so
      # if GitHub's API fails here the plan still goes out without it.
      - name: Fetch the last three days of comments, for the missed-log check
        if: steps.guard.outputs.run == 'yes'
        continue-on-error: true
        run: |
          SINCE=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&since=$SINCE&per_page=100" \
            --jq '.[] | select(.pull_request == null) | {number, id, title, user: .user.login, body, created_at} | tojson' \
            > "$RUNNER_TEMP/issues.jsonl"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/comments?since=$SINCE&per_page=100" \
            --jq '.[] | {id, issue: (.issue_url | split("/") | last | tonumber), user: .user.login, body, created_at} | tojson' \
            > "$RUNNER_TEMP/comments.jsonl"
          echo "Fetched $(wc -l < "$RUNNER_TEMP/issues.jsonl") issues and $(wc -l < "$RUNNER_TEMP/comments.jsonl") comments."

      # Each attempt starts from the newest main, so a push refused because a
      # log run got there first is redone on top of it. In order: log what a
      # log-solve run missed (sr.py sweep), then make today's plan. Plans
      # pause after a week without a logged solve (pause_after in sr.py); a
      # manual run ends the pause. A pause commits too, once a month: GitHub
      # disables scheduled workflows after 60 days without repository
      # activity. Subject format matches .githooks/commit-msg
      # ("MM-DD-YYYY: <message>"); the hook never runs on the runner, so the
      # format is kept here by hand.
      - name: Catch up, plan and commit (retried if another run pushed first)
        id: plan
        if: steps.guard.outputs.run == 'yes'
        env:
          PT_DATE: ${{ steps.guard.outputs.pt_date }}
          RESUME: ${{ github.event_name == 'workflow_dispatch' && '--resume' || '' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          : "${PT_DATE:?guard step did not set pt_date}"
          MSG_DATE="${PT_DATE:5:2}-${PT_DATE:8:2}-${PT_DATE:0:4}" # YYYY-MM-DD -> MM-DD-YYYY
          git config user.name "LambdaNotFound"
          git config user.email "yiqyudev@gmail.com"
          pushed=no mine=
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            # A push can land and still report failure. Then plan.md and the
            # late replies already describe what landed: keep them.
            if [ -n "$mine" ] && git merge-base --is-ancestor "$mine" FETCH_HEAD; then
              echo "The last push landed after all."; pushed=yes; break
            fi
            git reset -q --hard FETCH_HEAD
            python3 spaced_repetition/sr.py sweep --owner "$OWNER" \
              --issues "$RUNNER_TEMP/issues.jsonl" --comments "$RUNNER_TEMP/comments.jsonl" \
              --replies "$RUNNER_TEMP/late.json"
            if ! git diff --quiet spaced_repetition/state.json; then
              git add spaced_repetition/state.json
              git commit -q -m "$MSG_DATE: Log missed LeetCode solves"
            fi
            # plan.md is a scratch file in the runner's temp dir - it lives
            # only for this run and is never committed to the repo.
            python3 spaced_repetition/sr.py today --md --date "$PT_DATE" $RESUME \
              > "$RUNNER_TEMP/plan.md"
            status=$(python3 spaced_repetition/sr.py status --date "$PT_DATE")
            if ! git diff --quiet spaced_repetition/state.json; then
              case "$status" in
                paused\ *) msg="Keep daily LeetCode plan paused" ;;
                *)         msg="Record daily LeetCode plan" ;;
              esac
              git add spaced_repetition/state.json
              git commit -q -m "$MSG_DATE: $msg"
            fi
            if [ -z "$(git rev-list FETCH_HEAD..HEAD)" ]; then
              echo "state.json unchanged (idempotent rerun) - nothing to commit."
              pushed=yes; break
            fi
            mine=$(git rev-parse HEAD)
            if git push -q origin HEAD:main; then pushed=yes; break; fi
            echo "Push refused (attempt $attempt): another run pushed first. Planning again on top of it."
            sleep $((attempt * 3))
          done
          if [ "$pushed" != yes ]; then
            echo "::error::Could not push state.json after 5 attempts."
            exit 1
          fi
          cat "$RUNNER_TEMP/plan.md"
          case "$status" in
            paused\ *) title="Daily Practice paused since ${status#paused }" ;;
            *)         title="Daily Practice $PT_DATE" ;;
          esac
          echo "status=${status%% *}" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          printf '\ncc @%s\n' "$OWNER" >> "$RUNNER_TEMP/plan.md"

      # Always a brand-new issue for the day. The guard above already
      # skipped this run if today's issue exists, so the only way to reach
      # this step twice in a day is a manual re-dispatch - in which case we
      # update that same issue's body rather than opening a duplicate.
      # Previous days' issues are left open; nothing is auto-closed.
      # A pause gets one issue, on its first day: its title names that day,
      # so every later paused run finds it and stops here.
      - name: Create today's issue
        if: steps.guard.outputs.run == 'yes'
        env:
          TITLE: ${{ steps.plan.outputs.title }}
          STATUS: ${{ steps.plan.outputs.status }}
        run: |
          : "${TITLE:?plan step did not set a title}"
          # Same lookup as the guard's: this title, or its pre-11-25-2026 name.
          existing=""
          for t in "$TITLE" "Daily LeetCode${TITLE#Daily Practice}"; do
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                       --search "\"$t\" in:title" --state all \
                       --json number,title --jq '.[] | "\(.number)\t\(.title)"' \
                       | awk -F'\t' -v t="$t" '$2==t{print $1; exit}')
            if [ -n "$existing" ]; then break; fi
          done
          if [ -n "$existing" ] && [ "$STATUS" = paused ]; then
            echo "Still paused: issue #$existing already says so."
          elif [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/plan.md"
            echo "Manual re-run: refreshed body of existing issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body-file "$RUNNER_TEMP/plan.md"
          fi

      # Replies for what the missed-log check logged, posted only now that
      # the push went through. A log issue it logged from is closed, as
      # log-solve.yml would have.
      - name: Reply to comments the missed-log check logged
        if: steps.guard.outputs.run == 'yes'
        run: |
          [ -s "$RUNNER_TEMP/late.json" ] || exit 0
          jq -c '.[]' "$RUNNER_TEMP/late.json" | while read -r row; do
            n=$(jq -r .issue <<< "$row")
            jq -r .reply <<< "$row" > "$RUNNER_TEMP/late-reply.md"
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/late-reply.md"
            if [ "$(jq -r .close <<< "$row")" = true ]; then
              gh issue close "$n" --repo "$GITHUB_REPOSITORY"
            fi
          done
