name: log-solve

# Log solves from anywhere (GitHub mobile app / web) by commenting on the
# "Daily LeetCode" issue. Recognized patterns, any number per comment:
#   "solved 200 good"  ·  "1 easy, 33 again"  ·  "#5 hard"
# The workflow runs sr.py log for each pair, commits state.json, and
# replies with the next review dates.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-leetcode # serialize with the daily plan workflow
  cancel-in-progress: false

jobs:
  log:
    # Only the repo owner's comments on the Daily LeetCode issue,
    # and never the bot's own confirmation replies.
    if: >
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.issue.title, 'Daily LeetCode')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Passed via env, not template interpolation, so comment text
      # cannot inject shell commands.
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse comment and log solves (Pacific date)
        id: parse
        run: |
          PT_DATE=$(TZ=America/Los_Angeles date +%F)
          python3 - "$PT_DATE" <<'EOF'
          import os, re, subprocess, sys

          date = sys.argv[1]
          body = os.environ.get("COMMENT_BODY", "")
          # id, then optionally a few filler chars ("was", ":", "-"),
          # then a grade. Punctuation breaks a match so grades can't
          # attach to a number from an earlier clause.
          # Grade vocabulary comes from sr.py so the two never drift apart.
          sys.path.insert(0, "spaced_repetition")
          from sr import GRADE_ALIASES
          words = "|".join(sorted(GRADE_ALIASES, key=len, reverse=True))
          pairs = re.findall(rf"#?(\d+)[^\d\n,.;!?]{{0,12}}?\b({words})\b",
                             body, re.IGNORECASE)
          lines = []
          for pid, grade in pairs:
              r = subprocess.run(
                  ["python3", "spaced_repetition/sr.py",
                   "log", pid, grade.lower(), "--date", date],
                  capture_output=True, text=True)
              msg = (r.stdout or r.stderr).strip()
              lines.append(("- " if r.returncode == 0 else "- FAILED: ") + msg)
          # scratch file in the runner temp dir - never committed
          with open(os.path.join(os.environ["RUNNER_TEMP"], "reply.md"), "w") as f:
              if lines:
                  f.write("\n".join(lines) + "\n")

          # Did this comment look like someone trying to log a solve? If so
          # and nothing parsed, the next step explains the format instead of
          # failing silently.
          attempt = bool(re.search(rf"\b({words}|solved|logged|done)\b",
                                   body, re.IGNORECASE)) or bool(re.search(r"#\d", body))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"looked_like_attempt={'yes' if (attempt and not pairs) else 'no'}\n")
          print(f"parsed {len(pairs)} solve(s); body was: {body!r}")
          EOF

      - name: Commit updated state.json
        run: |
          if ! git diff --quiet spaced_repetition/state.json 2>/dev/null; then
            git config user.name "LambdaNotFound"
            git config user.email "yiqyudev@gmail.com"
            git add spaced_repetition/state.json
            git commit -m "sr: log solves from issue comment"
            git pull --rebase origin main
            git push
          fi

      - name: Reply with confirmation (or explain why nothing was logged)
        run: |
          if [ -s "$RUNNER_TEMP/reply.md" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          elif [ "${{ steps.parse.outputs.looked_like_attempt }}" = "yes" ]; then
            # Silence is indistinguishable from "the workflow never ran",
            # so say so explicitly when a comment looks like a log attempt.
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "$GITHUB_REPOSITORY" --body \
          "Nothing logged - I could not find a \`<number> <grade>\` pair in that comment.

          Use: \`1 good\` · \`solved 1 good\` · \`#1 good\` · \`1 good, 20 hard\`
          Grades: \`again\` (needed the solution) · \`hard\` (slow/messy) · \`good\` · \`easy\`

          Note: punctuation between the number and the grade breaks it - \`1. good\` will not match, \`1 good\` will."
          else
            echo "Comment did not look like a log attempt; staying quiet."
          fi
