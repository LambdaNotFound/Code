name: log-solve

# Log solves from anywhere (GitHub mobile app / web) by commenting on a
# daily plan issue (what the Daily Practice page at
# lambdanotfound.github.io/practice/ does), or by opening an issue titled
# "Practice log ..." (the page's fallback when it can't find that issue).
# One problem per line (or per comma): "20 good", "#54 hard (needed a hint)".
# "undo 54" takes back the latest log of #54; "resume" ends a pause and
# replies with the day's plan. The workflow runs `sr.py handle`, commits
# state.json, and replies with the next review dates. A log issue is closed
# once something is logged from it.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# No concurrency group, on purpose. A group holds one running and one waiting
# run, and a new arrival cancels the waiting one, so two comments during a
# busy run lost the first. Runs now start at once: the push loop below logs
# again on top of whatever another run pushed first, and state.json records
# each comment's id, so a retry or a re-run never logs it twice. A run that
# never finishes is caught by the daily workflow's missed-log check.

jobs:
  log:
    # Only the repo owner, never the bot's own confirmation replies: their
    # comments on a plan issue ("Daily Practice ...", or "Daily LeetCode ..."
    # from before 11-25-2026) or a log issue, and log issues they open.
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == github.repository_owner &&
       (contains(github.event.issue.title, 'Daily Practice') ||
        contains(github.event.issue.title, 'Daily LeetCode') ||
        startsWith(github.event.issue.title, 'Practice log'))) ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, 'Practice log'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Passed via env, not template interpolation, so the text cannot
      # inject shell commands. A new log issue is read from its body.
      BODY: ${{ github.event_name == 'issues' && github.event.issue.body || github.event.comment.body }}
      # What makes a comment count once: sr.py records it in state.json.
      EVENT: ${{ github.event_name == 'issues' && format('issue-{0}', github.event.issue.id) || format('comment-{0}', github.event.comment.id) }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The parser and the reply live in sr.py (`handle`), where test_sr.py
      # covers them. Each attempt starts from the newest main, so a push
      # refused because another run got there first is retried on top of it.
      # Subject format matches .githooks/commit-msg: "MM-DD-YYYY: <message>",
      # dated with the Pacific date the solves are logged under. The hook
      # never runs on the runner, so the format is kept here by hand.
      - name: Log solves and commit (retried if another run pushed first)
        id: log
        run: |
          PT_DATE=$(TZ=America/Los_Angeles date +%F)
          MSG_DATE="${PT_DATE:5:2}-${PT_DATE:8:2}-${PT_DATE:0:4}" # YYYY-MM-DD -> MM-DD-YYYY
          # scratch files in the runner temp dir - never committed
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.txt"
          git config user.name "LambdaNotFound"
          git config user.email "yiqyudev@gmail.com"
          pushed=no mine=
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            # A push can land and still report failure. Then the reply and
            # status already describe what landed: keep them, don't redo.
            if [ -n "$mine" ] && git merge-base --is-ancestor "$mine" FETCH_HEAD; then
              echo "The last push landed after all."; pushed=yes; break
            fi
            git reset -q --hard FETCH_HEAD
            python3 spaced_repetition/sr.py handle --event "$EVENT" --date "$PT_DATE" \
              --body-file "$RUNNER_TEMP/body.txt" --reply-file "$RUNNER_TEMP/reply.md" \
              --status-file "$RUNNER_TEMP/status" --plan-file "$RUNNER_TEMP/plan.md"
            if git diff --quiet spaced_repetition/state.json; then pushed=yes; break; fi
            git add spaced_repetition/state.json
            git commit -q -m "$MSG_DATE: Log LeetCode solves from issue #$ISSUE" -m "Event: $EVENT"
            mine=$(git rev-parse HEAD)
            if git push -q origin HEAD:main; then pushed=yes; break; fi
            echo "Push refused (attempt $attempt): another run pushed first. Logging again on top of it."
            sleep $((attempt * 3))
          done
          if [ "$pushed" != yes ]; then
            echo "::error::Could not push state.json after 5 attempts, so nothing was logged."
            exit 1
          fi
          cat "$RUNNER_TEMP/status" >> "$GITHUB_OUTPUT"
          echo "pt_date=$PT_DATE" >> "$GITHUB_OUTPUT"
          # Non-empty only when this comment topped up today's plan.
          if [ -s "$RUNNER_TEMP/plan.md" ]; then echo "plan=yes" >> "$GITHUB_OUTPUT"; fi

      # Logging a problem carried over from an earlier plan gives its budget
      # back, and sr.py tops up today's plan (top_up). Show the new plan in
      # today's issue. Issues are listed, not searched: the search index can
      # lag behind an issue created minutes ago.
      - name: Put the topped-up plan in today's issue
        if: steps.log.outputs.plan == 'yes'
        env:
          TITLE: Daily Practice ${{ steps.log.outputs.pt_date }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 50 \
              --json number,title --jq '.[] | "\(.number)\t\(.title)"' \
              | awk -F'\t' -v t="$TITLE" '$2==t{print $1; exit}')
          if [ -z "$n" ]; then
            echo "No issue titled '$TITLE'; the reply names what was added."
          else
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/plan.md"
            echo "Updated the plan in issue #$n."
          fi

      # The reply is empty for chatter. A comment that looks like a log
      # attempt but logs nothing gets the format explained instead: silence
      # would look like the workflow never ran.
      - name: Reply with confirmation (or explain why nothing was logged)
        run: |
          if [ -s "$RUNNER_TEMP/reply.md" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          else
            echo "Comment did not look like a log attempt; staying quiet."
          fi

      # A log issue has done its job once something was logged from it, by
      # the issue itself or by a corrected comment on it. One that logged
      # nothing stays open.
      - name: Close a log issue
        if: startsWith(github.event.issue.title, 'Practice log') && steps.log.outputs.done == 'yes'
        run: gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
