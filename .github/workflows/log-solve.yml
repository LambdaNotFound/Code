name: log-solve

# Log solves from anywhere (GitHub mobile app / web) by commenting on a
# daily plan issue, or by opening an issue titled "Practice log ..." (what
# the Daily Practice page at lambdanotfound.github.io/practice/ does).
# One problem per line (or per comma): "20 good", "#54 hard (needed a hint)".
# "undo 54" takes back the latest log of #54; "resume" ends a pause and
# replies with the day's plan. The workflow runs `sr.py handle`, commits
# state.json, and replies with the next review dates. A log issue is closed
# once something is logged from it.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-leetcode # serialize with the daily plan workflow
  cancel-in-progress: false

jobs:
  log:
    # Only the repo owner, never the bot's own confirmation replies: their
    # comments on a plan issue ("Daily Practice ...", or "Daily LeetCode ..."
    # from before 11-25-2026) or a log issue, and log issues they open.
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == github.repository_owner &&
       (contains(github.event.issue.title, 'Daily Practice') ||
        contains(github.event.issue.title, 'Daily LeetCode') ||
        startsWith(github.event.issue.title, 'Practice log'))) ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, 'Practice log'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Passed via env, not template interpolation, so the text cannot
      # inject shell commands. A new log issue is read from its body.
      BODY: ${{ github.event_name == 'issues' && github.event.issue.body || github.event.comment.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The parser, the reply and the record of applied comments all live in
      # sr.py (`handle`), where test_sr.py covers them. The event id makes a
      # comment count once, even if this run is retried or re-run.
      - name: Parse comment and log solves (Pacific date)
        id: parse
        env:
          EVENT: ${{ github.event_name == 'issues' && format('issue-{0}', github.event.issue.id) || format('comment-{0}', github.event.comment.id) }}
        run: |
          PT_DATE=$(TZ=America/Los_Angeles date +%F)
          echo "pt_date=$PT_DATE" >> "$GITHUB_OUTPUT" # the commit step dates its subject with it
          # scratch files in the runner temp dir - never committed
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.txt"
          python3 spaced_repetition/sr.py handle --event "$EVENT" --date "$PT_DATE" \
            --body-file "$RUNNER_TEMP/body.txt" --reply-file "$RUNNER_TEMP/reply.md" \
            --status-file "$RUNNER_TEMP/status"
          cat "$RUNNER_TEMP/status" >> "$GITHUB_OUTPUT"

      # Subject format matches .githooks/commit-msg: "MM-DD-YYYY: <message>",
      # dated with the same Pacific date the solves were logged under. The
      # hook never runs on the runner, so the format is kept here by hand.
      - name: Commit updated state.json
        env:
          PT_DATE: ${{ steps.parse.outputs.pt_date }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if ! git diff --quiet spaced_repetition/state.json 2>/dev/null; then
            : "${PT_DATE:?parse step did not set pt_date}"
            MSG_DATE="${PT_DATE:5:2}-${PT_DATE:8:2}-${PT_DATE:0:4}" # YYYY-MM-DD -> MM-DD-YYYY
            git config user.name "LambdaNotFound"
            git config user.email "yiqyudev@gmail.com"
            git add spaced_repetition/state.json
            git commit -m "$MSG_DATE: Log LeetCode solves from issue #$ISSUE"
            git pull --rebase origin main
            git push
          fi

      # The reply is empty for chatter. A comment that looks like a log
      # attempt but logs nothing gets the format explained instead: silence
      # would look like the workflow never ran.
      - name: Reply with confirmation (or explain why nothing was logged)
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -s "$RUNNER_TEMP/reply.md" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          else
            echo "Comment did not look like a log attempt; staying quiet."
          fi

      # A log issue has done its job once something was logged from it, by
      # the issue itself or by a corrected comment on it. One that logged
      # nothing stays open.
      - name: Close a log issue
        if: startsWith(github.event.issue.title, 'Practice log') && steps.parse.outputs.done == 'yes'
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
