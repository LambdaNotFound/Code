[package]
name = "tokio_hello_world"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

# Cargo only auto-discovers examples in a folder literally named `examples/`;
# this crate's examples live in `tokio_examples/`, so each target is declared
# explicitly below.
[[example]]
name = "cancellation"
path = "tokio_examples/cancellation.rs"

[[example]]
name = "channels"
path = "tokio_examples/channels.rs"

[[example]]
name = "cooperative_scheduling"
path = "tokio_examples/cooperative_scheduling.rs"

[[example]]
name = "error_handling"
path = "tokio_examples/error_handling.rs"

[[example]]
name = "leaky_bucket"
path = "tokio_examples/leaky_bucket.rs"
test = true

[[example]]
name = "runtime_flavors"
path = "tokio_examples/runtime_flavors.rs"

[[example]]
name = "select_macro"
path = "tokio_examples/select_macro.rs"

[[example]]
name = "shared_state"
path = "tokio_examples/shared_state.rs"

[[example]]
name = "sleep_and_timeout"
path = "tokio_examples/sleep_and_timeout.rs"

[[example]]
name = "spawn_and_join"
path = "tokio_examples/spawn_and_join.rs"

[[example]]
name = "spawn_blocking"
path = "tokio_examples/spawn_blocking.rs"

[[example]]
name = "structured_concurrency"
path = "tokio_examples/structured_concurrency.rs"

# rust/basics_examples/ mirrors the same "register each example by hand"
# convention as tokio_examples/ above, for the companion "Rust Basics 101"
# tutorial.
[[example]]
name = "ownership_and_move"
path = "basics_examples/ownership_and_move.rs"

[[example]]
name = "borrowing_and_references"
path = "basics_examples/borrowing_and_references.rs"

[[example]]
name = "copy_vs_clone"
path = "basics_examples/copy_vs_clone.rs"

[[example]]
name = "structs_and_methods"
path = "basics_examples/structs_and_methods.rs"

[[example]]
name = "enums_and_pattern_matching"
path = "basics_examples/enums_and_pattern_matching.rs"

[[example]]
name = "option_type"
path = "basics_examples/option_type.rs"

[[example]]
name = "result_type"
path = "basics_examples/result_type.rs"

[[example]]
name = "slices_and_arrays"
path = "basics_examples/slices_and_arrays.rs"

[[example]]
name = "strings_str_vs_string"
path = "basics_examples/strings_str_vs_string.rs"

[[example]]
name = "vec_and_hashmap"
path = "basics_examples/vec_and_hashmap.rs"

[[example]]
name = "traits_vs_interfaces"
path = "basics_examples/traits_vs_interfaces.rs"

[[example]]
name = "generics_and_trait_bounds"
path = "basics_examples/generics_and_trait_bounds.rs"
