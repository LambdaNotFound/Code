[package]
name = "tokio_hello_world"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"

# LeetCode solutions under dsa/, mirroring go/dsa/. A library target so
# `cargo test` runs their unit tests; src/main.rs does not use it.
[lib]
name = "dsa"
path = "dsa/lib.rs"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

# Cargo only auto-discovers examples in a folder literally named `examples/`;
# this crate's examples live in `features/tokio/` and `features/basics/`, so
# each target is declared explicitly below.
[[example]]
name = "cancellation"
path = "features/tokio/cancellation.rs"

[[example]]
name = "channels"
path = "features/tokio/channels.rs"

[[example]]
name = "cooperative_scheduling"
path = "features/tokio/cooperative_scheduling.rs"

[[example]]
name = "error_handling"
path = "features/tokio/error_handling.rs"

[[example]]
name = "leaky_bucket"
path = "features/tokio/leaky_bucket.rs"
test = true

[[example]]
name = "runtime_flavors"
path = "features/tokio/runtime_flavors.rs"

[[example]]
name = "select_macro"
path = "features/tokio/select_macro.rs"

[[example]]
name = "shared_state"
path = "features/tokio/shared_state.rs"

[[example]]
name = "sleep_and_timeout"
path = "features/tokio/sleep_and_timeout.rs"

[[example]]
name = "spawn_and_join"
path = "features/tokio/spawn_and_join.rs"

[[example]]
name = "spawn_blocking"
path = "features/tokio/spawn_blocking.rs"

[[example]]
name = "structured_concurrency"
path = "features/tokio/structured_concurrency.rs"

# features/basics/ mirrors the same "register each example by hand"
# convention as features/tokio/ above, for the companion "Rust Basics 101"
# tutorial.
[[example]]
name = "ownership_and_move"
path = "features/basics/ownership_and_move.rs"

[[example]]
name = "borrowing_and_references"
path = "features/basics/borrowing_and_references.rs"

[[example]]
name = "copy_vs_clone"
path = "features/basics/copy_vs_clone.rs"

[[example]]
name = "structs_and_methods"
path = "features/basics/structs_and_methods.rs"

[[example]]
name = "enums_and_pattern_matching"
path = "features/basics/enums_and_pattern_matching.rs"

[[example]]
name = "option_type"
path = "features/basics/option_type.rs"

[[example]]
name = "result_type"
path = "features/basics/result_type.rs"

[[example]]
name = "slices_and_arrays"
path = "features/basics/slices_and_arrays.rs"

[[example]]
name = "strings_str_vs_string"
path = "features/basics/strings_str_vs_string.rs"

[[example]]
name = "vec_and_hashmap"
path = "features/basics/vec_and_hashmap.rs"

[[example]]
name = "traits_vs_interfaces"
path = "features/basics/traits_vs_interfaces.rs"

[[example]]
name = "generics_and_trait_bounds"
path = "features/basics/generics_and_trait_bounds.rs"
